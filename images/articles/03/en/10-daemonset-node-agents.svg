<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#F7F9FC"/>

  <!-- workload labels -->
  <rect x="48" y="52" width="430" height="54" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="263" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="700">ReplicaSet: maintain three web Pods</text>
  <text x="263" y="94" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#9A3412">total count is correct, but one Pod per Node is not guaranteed</text>

  <rect x="522" y="52" width="430" height="54" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="737" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#047857" font-weight="700">DaemonSet: one log-agent Pod on each Node</text>
  <text x="737" y="94" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#065F46">a new Node automatically receives the agent</text>

  <!-- central log archive -->
  <rect x="393" y="126" width="214" height="62" rx="13" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <path d="M420 143 H449 L458 152 H580 V175 H420 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="514" y="165" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#1D4ED8" font-weight="700">central log storage</text>

  <!-- Node A -->
  <rect x="45" y="220" width="280" height="250" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="45" y="220" width="280" height="48" rx="18" fill="#F5F3FF"/>
  <rect x="45" y="250" width="280" height="18" fill="#F5F3FF"/>
  <text x="185" y="250" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#6D28D9" font-weight="700">Worker Node A</text>

  <rect x="70" y="290" width="105" height="68" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="122.5" y="318" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#C2410C" font-weight="700">web Pod</text>
  <text x="122.5" y="339" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#EA580C">ReplicaSet</text>
  <rect x="195" y="290" width="105" height="68" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="247.5" y="318" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#C2410C" font-weight="700">web Pod</text>
  <text x="247.5" y="339" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#EA580C">ReplicaSet</text>
  <rect x="70" y="382" width="230" height="58" rx="11" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <circle cx="98" cy="411" r="12" fill="#5EEAD4"/>
  <path d="M91 411 L96 416 L106 405" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <text x="191" y="407" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="700">log-agent Pod</text>
  <text x="191" y="426" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#047857">collect logs from this Node</text>

  <!-- Node B -->
  <rect x="360" y="220" width="280" height="250" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="360" y="220" width="280" height="48" rx="18" fill="#F5F3FF"/>
  <rect x="360" y="250" width="280" height="18" fill="#F5F3FF"/>
  <text x="500" y="250" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#6D28D9" font-weight="700">Worker Node B</text>

  <rect x="448" y="290" width="105" height="68" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="500.5" y="318" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#C2410C" font-weight="700">web Pod</text>
  <text x="500.5" y="339" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#EA580C">ReplicaSet</text>
  <rect x="385" y="382" width="230" height="58" rx="11" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <circle cx="413" cy="411" r="12" fill="#5EEAD4"/>
  <path d="M406 411 L411 416 L421 405" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <text x="506" y="407" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="700">log-agent Pod</text>
  <text x="506" y="426" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#047857">collect logs from this Node</text>

  <!-- Node C -->
  <rect x="675" y="220" width="280" height="250" rx="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="675" y="220" width="280" height="48" rx="18" fill="#F5F3FF"/>
  <rect x="675" y="250" width="280" height="18" fill="#F5F3FF"/>
  <text x="815" y="250" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#6D28D9" font-weight="700">Worker Node C (new Node)</text>

  <rect x="735" y="294" width="160" height="60" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="815" y="319" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#64748B">no web Pod</text>
  <text x="815" y="338" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#94A3B8">desired web Pod count already met</text>
  <rect x="700" y="382" width="230" height="58" rx="11" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <circle cx="728" cy="411" r="12" fill="#5EEAD4"/>
  <path d="M721 411 L726 416 L736 405" fill="none" stroke="#0F766E" stroke-width="2.5"/>
  <text x="821" y="407" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="700">log-agent Pod</text>
  <text x="821" y="426" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#047857">log-agent Pod added to new Node</text>

  <!-- log collection lines -->
  <path d="M70 411 H25 V198 H455 V188" fill="none" stroke="#60A5FA" stroke-width="1.8"/>
  <path d="M385 411 H342 V206 H485 V188" fill="none" stroke="#60A5FA" stroke-width="1.8"/>
  <path d="M930 411 H975 V214 H545 V188" fill="none" stroke="#60A5FA" stroke-width="1.8"/>

  <line x1="40" y1="510" x2="960" y2="510" stroke="#E2E8F0"/>
  <text x="500" y="542" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 10. Why use a DaemonSet:</tspan>
    <tspan> collecting logs on every Node regardless of application Pod placement</tspan>
  </text>
</svg>
