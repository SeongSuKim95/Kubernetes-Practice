<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430">
  <rect width="1040" height="430" fill="#F7F9FC"/>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect x="35" y="25" width="720" height="320" rx="20" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="60" y="58" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#6D28D9" font-weight="700">One Pod</text>
  <text x="60" y="80" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#7C3AED">Both containers share a node and volume</text>

  <rect x="75" y="110" width="240" height="105" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="195" y="143" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#1D4ED8" font-weight="700">Application container</text>
  <text x="195" y="170" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#3B82F6">Handle API requests</text>
  <text x="195" y="192" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#3B82F6">Write logs to /var/log/app</text>

  <rect x="475" y="110" width="240" height="105" rx="14" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="595" y="143" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="700">Log collector sidecar</text>
  <text x="595" y="170" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">Read logs from /var/log/app</text>
  <text x="595" y="192" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">Send to external log storage</text>

  <rect x="275" y="265" width="240" height="58" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="395" y="289" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#C2410C" font-weight="700">Shared volume</text>
  <text x="395" y="310" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#EA580C">app-logs</text>

  <path d="M195 215 V294 H275" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="218" y="278" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Write logs</text>
  <path d="M515 294 H595 V215" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="548" y="278" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0F766E">Read logs</text>

  <rect x="870" y="125" width="125" height="75" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="932.5" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E" font-weight="700">External log</text>
  <text x="932.5" y="178" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E" font-weight="700">storage</text>
  <path d="M715 162.5 H870" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="805" y="147" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0F766E">Send logs</text>

  <line x1="40" y1="375" x2="1000" y2="375" stroke="#E2E8F0"/>
  <text x="520" y="405" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 5. Sidecar pattern:</tspan>
    <tspan> Log collection through a shared Pod volume</tspan>
  </text>
</svg>
