<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="640" viewBox="0 0 1050 640">
  <rect width="1050" height="640" fill="#F7F9FC"/>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="40" y="55" width="190" height="125" rx="15" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="135" y="90" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#0F766E" font-weight="600">ReplicaSet</text>
  <text x="135" y="123" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#0D9488">Pod 복제본이 부족한지 확인</text>
  <text x="135" y="148" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#0D9488">필요한 새 Pod 생성</text>

  <path d="M230 117.5 H285" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="257.5" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">Pod 객체 생성</text>

  <rect x="285" y="42" width="225" height="151" rx="15" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="397.5" y="76" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="600">새 Pod</text>
  <text x="397.5" y="99" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">아직 Worker Node가 정해지지 않음</text>
  <rect x="310" y="116" width="175" height="27" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="397.5" y="134" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">CPU 1, 메모리 1Gi 요청</text>
  <rect x="310" y="151" width="175" height="27" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="397.5" y="169" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Pod의 배치 제약</text>

  <path d="M510 117.5 H565" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="537.5" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">미배치 Pod 관찰</text>

  <rect x="565" y="42" width="445" height="151" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="787.5" y="77" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="600">Scheduler</text>
  <rect x="595" y="101" width="180" height="61" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="685" y="124" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#1D4ED8" font-weight="600">1. 후보 노드 거르기</text>
  <text x="685" y="146" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#3B82F6">자원 여유와 배치 제약 확인</text>
  <rect x="800" y="101" width="180" height="61" rx="9" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="890" y="124" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#1D4ED8" font-weight="600">2. 후보 노드 점수 계산</text>
  <text x="890" y="146" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#3B82F6">점수가 높은 노드 선택</text>

  <path d="M787.5 193 V226 H175 V260" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M787.5 226 H525 V260" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M787.5 226 H875 V260" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="360" y="216" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">각 Worker Node를 같은 기준으로 평가</text>

  <rect x="40" y="260" width="270" height="132" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="175" y="292" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Worker Node A</text>
  <text x="175" y="322" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#475569">여유 CPU 2, 메모리 4Gi</text>
  <text x="175" y="346" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#475569">Pod 배치 제약 충족</text>
  <rect x="85" y="359" width="180" height="24" rx="7" fill="#ECFDF5"/>
  <text x="175" y="376" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">후보 노드로 통과</text>

  <rect x="390" y="260" width="270" height="132" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="525" y="292" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#B91C1C" font-weight="600">Worker Node B</text>
  <text x="525" y="322" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#475569">여유 CPU 0.5, 메모리 4Gi</text>
  <text x="525" y="346" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#475569">CPU 요청을 수용하지 못함</text>
  <rect x="435" y="359" width="180" height="24" rx="7" fill="#FEE2E2"/>
  <text x="525" y="376" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#B91C1C">후보 노드에서 제외</text>

  <rect x="740" y="260" width="270" height="132" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="875" y="292" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Worker Node C</text>
  <text x="875" y="322" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#475569">여유 CPU 4, 메모리 8Gi</text>
  <text x="875" y="346" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#475569">Pod 배치 제약 충족</text>
  <rect x="785" y="359" width="180" height="24" rx="7" fill="#ECFDF5"/>
  <text x="875" y="376" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">후보 노드로 통과</text>

  <path d="M175 392 V440" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M525 392 V440" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <path d="M875 392 V440" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="70" y="440" width="210" height="55" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="1.5"/>
  <text x="175" y="462" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#0F766E" font-weight="600">후보 유지</text>
  <text x="175" y="482" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0D9488">상대적으로 낮은 점수</text>

  <rect x="420" y="440" width="210" height="55" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="525" y="474" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#B91C1C" font-weight="600">점수 계산 대상 아님</text>

  <rect x="770" y="440" width="210" height="55" rx="10" fill="#D1FAE5" stroke="#0D9488" stroke-width="2"/>
  <text x="875" y="462" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#047857" font-weight="600">Worker Node C 선택</text>
  <text x="875" y="482" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#059669">상대적으로 높은 점수</text>

  <rect x="105" y="520" width="840" height="42" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="525" y="546" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#B45309">Scheduler는 새 Pod마다 이 판단을 반복하며, 별도 제약이 없으면 복제본을 노드별로 하나씩 분산한다고 보장하지 않음</text>

  <line x1="40" y1="590" x2="1010" y2="590" stroke="#E2E8F0" stroke-width="1"/>
  <text x="525" y="620" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 9. Pod의 Worker Node 배치:</tspan>
    <tspan> 자원 요청과 배치 제약을 이용한 후보 필터링과 점수 계산</tspan>
  </text>
</svg>
