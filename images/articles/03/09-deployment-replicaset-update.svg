  <line x1="40" y1="466" x2="960" y2="466" stroke="#E2E8F0"/>
  <text x="500" y="490" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
