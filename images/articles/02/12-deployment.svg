  <text x="837.5" y="80" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">이름과 IP는 달라도 같은 Label과 역할</text>
  <rect x="745" y="96" width="185" height="34" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="837.5" y="118" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Pod web-a7f2, app=web</text>
  <rect x="745" y="140" width="185" height="34" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="837.5" y="162" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Pod web-k9m4, app=web</text>
  <rect x="745" y="184" width="185" height="34" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="837.5" y="206" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Pod web-p3x8, app=web</text>

  <path d="M837.5 230 V252 H650 V275" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="748" y="246" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">각 Pod의 배치 요청</text>

  <rect x="285" y="275" width="430" height="90" rx="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="500" y="308" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="700">Scheduler</text>
  <text x="500" y="333" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#3B82F6">아직 Node가 정해지지 않은 각 Pod를 독립적으로 평가</text>
  <text x="500" y="352" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#3B82F6">자원 요청과 배치 제약을 기준으로 Worker Node 하나를 선택</text>

  <path d="M500 365 V405 H170 V435" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#blue)"/>
  <path d="M500 405 V435" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#blue)"/>
  <path d="M500 405 H830 V435" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#blue)"/>
  <text x="500" y="397" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">배치 결과 기록</text>

  <rect x="35" y="435" width="270" height="125" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="170" y="468" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#334155" font-weight="700">Worker Node A</text>
  <rect x="80" y="490" width="180" height="48" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="170" y="510" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Pod web-a7f2</text>
  <text x="170" y="528" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#3B82F6">app=web, image v1</text>

  <rect x="365" y="435" width="270" height="125" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="500" y="468" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#334155" font-weight="700">Worker Node B</text>
  <rect x="410" y="490" width="180" height="48" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="500" y="510" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Pod web-k9m4</text>
  <text x="500" y="528" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#3B82F6">app=web, image v1</text>

  <rect x="695" y="435" width="270" height="125" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="830" y="468" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#334155" font-weight="700">Worker Node C</text>
  <rect x="740" y="490" width="180" height="48" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="830" y="510" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Pod web-p3x8</text>
  <text x="830" y="528" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#3B82F6">app=web, image v1</text>

  <rect x="95" y="585" width="810" height="42" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="500" y="611" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#B45309">그림은 세 Node에 나뉜 배치 예시이며, 별도 배치 조건이 없으면 Node별 분산을 보장하지 않음</text>

  <line x1="40" y1="660" x2="960" y2="660" stroke="#E2E8F0"/>
  <text x="500" y="690" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 6. Deployment와 ReplicaSet:</tspan>
    <tspan> Pod 복제본 유지와 여러 Worker Node 배치의 책임 분리</tspan>
  </text>
