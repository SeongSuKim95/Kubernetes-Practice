  </defs>

  <rect x="35" y="35" width="225" height="185" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="147.5" y="70" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#C2410C" font-weight="700">Deployment</text>
  <text x="147.5" y="99" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#EA580C">배포 상태와 ReplicaSet 관리</text>
  <rect x="65" y="120" width="165" height="35" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="147.5" y="143" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#C2410C">replicas: 3</text>
  <rect x="65" y="165" width="165" height="35" rx="8" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="147.5" y="188" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#C2410C">Pod template: image v1</text>

  <path d="M260 127.5 H365" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#orange)"/>
  <text x="312.5" y="109" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#C2410C">생성하고 관리</text>

  <rect x="375" y="35" width="240" height="185" rx="16" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="495" y="70" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" fill="#0F766E" font-weight="700">ReplicaSet</text>
  <text x="495" y="99" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#0D9488">같은 역할의 Pod 복제본 유지</text>
  <rect x="405" y="120" width="180" height="35" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="495" y="143" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#047857">Selector: app=web</text>
  <rect x="405" y="165" width="180" height="35" rx="8" fill="#FFFFFF" stroke="#6EE7B7"/>
  <text x="495" y="188" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#047857">원하는 3, 현재 3</text>

  <path d="M615 127.5 H700" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="657.5" y="109" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">Pod 객체 생성</text>

  <rect x="710" y="25" width="255" height="205" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
