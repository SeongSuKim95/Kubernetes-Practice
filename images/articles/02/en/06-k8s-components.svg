<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700">
  <rect width="980" height="700" fill="#F7F9FC"/>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <!-- kubectl: same box shape as other components (diamond has no special meaning) -->
  <rect x="40" y="20" width="120" height="44" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="100" y="47" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#92400E" font-weight="600">kubectl</text>
  <path d="M100 64 V165" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" marker-end="url(#ao)"/>

  <!-- Master -->
  <rect x="30" y="110" width="340" height="470" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#1D4ED8" font-weight="600">Master / Control Plane</text>

  <rect x="70" y="165" width="260" height="50" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="200" y="196" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">API server</text>

  <!-- controller / scheduler with orthogonal arrows -->
  <rect x="50" y="280" width="140" height="48" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="120" y="310" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#334155" font-weight="600">controller-manager</text>
  <path d="M120 280 V240 H160" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>

  <rect x="210" y="280" width="130" height="48" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="275" y="310" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#334155" font-weight="600">scheduler</text>
  <path d="M275 280 V240 H240" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- etcd -->
  <ellipse cx="200" cy="400" rx="58" ry="15" fill="#1E3A8A"/>
  <rect x="142" y="400" width="116" height="30" fill="#1E3A8A"/>
  <ellipse cx="200" cy="430" rx="58" ry="15" fill="#1E40AF"/>
  <rect x="142" y="430" width="116" height="30" fill="#1E40AF"/>
  <ellipse cx="200" cy="460" rx="58" ry="15" fill="#2563EB"/>
  <text x="200" y="452" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">etcd</text>
  <path d="M200 215 V385" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>

  <!-- Internet -->
  <ellipse cx="840" cy="48" rx="72" ry="26" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="840" y="53" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8" font-weight="600">Internet</text>

  <!-- Node 1 -->
  <rect x="410" y="110" width="540" height="250" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="138" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">node</text>

  <rect x="450" y="155" width="130" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="515" y="180" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#334155" font-weight="600">kubelet</text>

  <rect x="760" y="155" width="140" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="830" y="180" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#334155" font-weight="600">kube-proxy</text>

  <!-- API <-> kubelet node1: separate lanes (top / bottom) -->
  <path d="M330 185 H450" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>
  <path d="M450 195 H330" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ab)"/>

  <!-- Internet -> kube-proxy (solid, connects box edges) -->
  <line x1="840" y1="74" x2="840" y2="155" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#ap)"/>

  <!-- container runtime box -->
  <rect x="450" y="215" width="470" height="125" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="1.5"/>
  <text x="685" y="238" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">container runtime</text>

  <!-- Pod 1 with 3 stacked containers -->
  <rect x="490" y="250" width="160" height="75" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="570" y="268" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">Pod</text>
  <rect x="505" y="276" width="130" height="14" rx="3" fill="#2563EB"/>
  <text x="570" y="286" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="505" y="293" width="130" height="14" rx="3" fill="#3B82F6"/>
  <text x="570" y="303" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="505" y="310" width="130" height="8" rx="2" fill="#93C5FD"/>

  <!-- Pod 2 -->
  <rect x="700" y="250" width="160" height="75" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="780" y="268" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">Pod</text>
  <rect x="715" y="276" width="130" height="14" rx="3" fill="#2563EB"/>
  <text x="780" y="286" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="715" y="293" width="130" height="14" rx="3" fill="#3B82F6"/>
  <text x="780" y="303" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="715" y="310" width="130" height="8" rx="2" fill="#93C5FD"/>

  <!-- kubelet -> Pod1, kube-proxy -> Pod2 (same color; clear of label at x=685) -->
  <path d="M515 195 V250" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#ao)"/>
  <path d="M830 195 V250" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#ao)"/>

  <!-- Node 2 -->
  <rect x="410" y="380" width="540" height="230" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="408" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">node</text>

  <rect x="450" y="420" width="130" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="515" y="445" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#334155" font-weight="600">kubelet</text>

  <rect x="760" y="420" width="140" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="830" y="445" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#334155" font-weight="600">kube-proxy</text>

  <!-- API <-> kubelet node2: orthogonal via bottom corridor -->
  <path d="M330 200 H390 V440 H450" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ab)"/>
  <path d="M450 450 H380 V210 H330" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ab)"/>

  <rect x="450" y="480" width="470" height="110" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="1.5"/>
  <text x="685" y="500" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">container runtime</text>

  <rect x="490" y="510" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="570" y="526" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">Pod</text>
  <rect x="505" y="534" width="130" height="14" rx="3" fill="#2563EB"/>
  <text x="570" y="544" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="505" y="551" width="130" height="14" rx="3" fill="#3B82F6"/>
  <text x="570" y="561" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="505" y="568" width="130" height="8" rx="2" fill="#93C5FD"/>

  <rect x="700" y="510" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
  <text x="780" y="526" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">Pod</text>
  <rect x="715" y="534" width="130" height="14" rx="3" fill="#2563EB"/>
  <text x="780" y="544" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="715" y="551" width="130" height="14" rx="3" fill="#3B82F6"/>
  <text x="780" y="561" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9" fill="#FFFFFF">container</text>
  <rect x="715" y="568" width="130" height="8" rx="2" fill="#93C5FD"/>

  <path d="M515 460 V510" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#ao)"/>
  <path d="M830 460 V510" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#ao)"/>

  <line x1="40" y1="630" x2="940" y2="630" stroke="#E2E8F0" stroke-width="1"/>
  <text x="490" y="658" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 8. Cluster components:</tspan>
    <tspan> Control Plane and Worker Node</tspan>
  </text>
</svg>
