<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="920" height="400" fill="#F7F9FC"/>

  <rect x="60" y="40" width="160" height="60" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="140" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#92400E" font-weight="600">User (kubectl)</text>

  <path d="M220 70 H300" fill="none" stroke="#2563EB" stroke-width="2"/>
  <text x="260" y="55" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#2563EB">One address</text>

  <rect x="300" y="30" width="560" height="300" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="580" y="60" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#1D4ED8" font-weight="600">Control Plane (HA)</text>

  <rect x="340" y="85" width="150" height="55" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="415" y="118" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8" font-weight="600">API Server 1</text>

  <rect x="510" y="85" width="150" height="55" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="585" y="118" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8" font-weight="600">API Server 2</text>

  <rect x="680" y="85" width="150" height="55" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="755" y="110" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#B91C1C" font-weight="600">API Server 3</text>
  <text x="755" y="128" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#DC2626">Failure</text>

  <text x="580" y="170" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488" font-weight="600">Requests continue on remaining API Servers</text>

  <rect x="360" y="200" width="130" height="50" rx="10" fill="#1E40AF"/>
  <text x="425" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">etcd 1</text>
  <rect x="515" y="200" width="130" height="50" rx="10" fill="#1E40AF"/>
  <text x="580" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">etcd 2</text>
  <rect x="670" y="200" width="130" height="50" rx="10" fill="#1E40AF"/>
  <text x="735" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">etcd 3</text>
  <text x="580" y="280" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#475569">With quorum, state storage continues</text>
  <text x="580" y="305" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">Multiple Worker Nodes below</text>

  <line x1="40" y1="355" x2="880" y2="355" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="383" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 12. High availability:</tspan>
    <tspan> API and state storage that survive partial failure</tspan>
  </text>
