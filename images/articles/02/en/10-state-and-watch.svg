<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510">
  <rect width="1080" height="510" fill="#F7F9FC"/>
  <defs>
    <marker id="w" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="wg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
  </defs>

  <!--
    Layout:
      etcd above API Server (center x=500)
      user left of API Server
      boxes centers: 160 / 500 / 840
      write-back: box bottom-center → down → right outer → up → API Server right
  -->

  <!-- ===== etcd (above API Server) ===== -->
  <ellipse cx="500" cy="36" rx="64" ry="14" fill="#1E40AF"/>
  <rect x="436" y="36" width="128" height="20" fill="#1E40AF"/>
  <ellipse cx="500" cy="56" rx="64" ry="14" fill="#2563EB"/>
  <text x="500" y="52" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">etcd</text>
  <text x="580" y="48" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#64748B">State store</text>

  <!-- save: API Server → etcd (label to the left of vertical arrow) -->
  <text x="472" y="88" text-anchor="end" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Store</text>
  <line x1="500" y1="100" x2="500" y2="70" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" marker-end="url(#w)"/>

  <!-- ===== user + API Server row ===== -->
  <rect x="70" y="100" width="160" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="150" y="124" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#92400E" font-weight="600">User</text>
  <text x="150" y="142" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#B45309">kubectl apply</text>

  <text x="295" y="118" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Declare request</text>
  <line x1="230" y1="128" x2="380" y2="128" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" marker-end="url(#w)"/>

  <rect x="380" y="100" width="240" height="56" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="500" y="124" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">API Server</text>
  <text x="500" y="142" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">Receive and validate state</text>

  <!-- ===== Watch from API Server ===== -->
  <text x="575" y="178" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E" font-weight="600">Subscribe to state changes (Watch)</text>

  <line x1="500" y1="156" x2="500" y2="210" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="210" x2="840" y2="210" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="160" y1="210" x2="160" y2="250" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wg)"/>
  <line x1="500" y1="210" x2="500" y2="250" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wg)"/>
  <line x1="840" y1="210" x2="840" y2="250" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wg)"/>

  <!-- ===== three boxes (centers 160 / 500 / 840) ===== -->
  <rect x="50" y="254" width="220" height="72" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="160" y="284" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">Controller Manager</text>
  <text x="160" y="306" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#EA580C">Match Pod count</text>

  <rect x="390" y="254" width="220" height="72" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="500" y="284" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">Scheduler</text>
  <text x="500" y="306" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#EA580C">Assign placement node</text>

  <rect x="730" y="254" width="220" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="840" y="284" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#5B21B6" font-weight="600">Kubelet (per Node)</text>
  <text x="840" y="306" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#7C3AED">Run containers and report status</text>

  <!-- ===== write-back from each box bottom-center → right outer → API Server right ===== -->
  <!-- box bottoms at y=326; centers 160, 500, 840 -->
  <line x1="160" y1="326" x2="160" y2="380" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <line x1="500" y1="326" x2="500" y2="380" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <line x1="840" y1="326" x2="840" y2="380" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="380" x2="1000" y2="380" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/>

  <!-- right outer up to API Server right edge (x=620, y=128) -->
  <path d="M1000 380 V128 H620" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#w)"/>

  <!-- label beside right vertical, clear of boxes and Watch -->
  <text x="1012" y="250" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Result</text>
  <text x="1012" y="266" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">Record</text>

  <text x="540" y="418" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">Results written back via API Server (persisted to etcd)</text>

  <line x1="50" y1="448" x2="1030" y2="448" stroke="#E2E8F0" stroke-width="1"/>
  <text x="540" y="480" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 10. State storage and Watch:</tspan>
    <tspan> State reconciliation via store and subscribe</tspan>
  </text>
</svg>
