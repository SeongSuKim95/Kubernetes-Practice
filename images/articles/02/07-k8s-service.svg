<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <rect width="1100" height="700" fill="#F7F9FC"/>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect x="20" y="25" width="1060" height="295" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="45" y="56" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">API 상태와 제어 루프</text>

  <rect x="45" y="78" width="225" height="180" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="157.5" y="111" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#0F766E" font-weight="600">Service 리소스</text>
  <text x="157.5" y="136" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">안정적인 서비스 정체성 선언</text>
  <rect x="70" y="153" width="175" height="30" rx="7" fill="#ECFDF5"/>
  <text x="157.5" y="173" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">DNS 이름과 ClusterIP</text>
  <rect x="70" y="192" width="175" height="30" rx="7" fill="#ECFDF5"/>
  <text x="157.5" y="212" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">Selector: app=web</text>
  <rect x="70" y="231" width="175" height="19" rx="6" fill="#ECFDF5"/>
  <text x="157.5" y="245" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9.8" fill="#047857">port 80, targetPort 8080</text>

  <rect x="310" y="78" width="250" height="180" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="435" y="111" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="600">변하는 Pod 상태</text>
  <text x="435" y="136" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">이름과 IP, 준비 상태가 바뀔 수 있음</text>
  <rect x="335" y="153" width="200" height="27" rx="7" fill="#EFF6FF"/>
  <text x="435" y="171" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Pod A  app=web  Ready</text>
