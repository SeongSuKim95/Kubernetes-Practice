  <text x="435" y="208" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Pod B  app=web  Ready</text>
  <rect x="335" y="227" width="200" height="27" rx="7" fill="#F1F5F9"/>
  <text x="435" y="245" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#64748B">Pod C  app=web  NotReady</text>

  <rect x="610" y="78" width="205" height="180" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
