  <text x="712.5" y="224" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">EndpointSlice에 기록</text>

  <path d="M270 115 V66 H712.5 V78" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="480" y="59" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Service 선언 관찰</text>
  <path d="M560 168 H610" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
