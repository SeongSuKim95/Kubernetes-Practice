  <path d="M815 168 H860" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="837.5" y="151" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">목록 갱신</text>

  <rect x="860" y="78" width="195" height="180" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="957.5" y="111" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#0F766E" font-weight="600">EndpointSlice</text>
  <text x="957.5" y="136" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">현재 네트워크 대상 상태</text>
  <rect x="885" y="153" width="145" height="31" rx="7" fill="#ECFDF5"/>
  <text x="957.5" y="173" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">Pod A IP  Ready</text>
  <rect x="885" y="193" width="145" height="31" rx="7" fill="#ECFDF5"/>
  <text x="957.5" y="213" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">Pod B IP  Ready</text>
  <text x="957.5" y="244" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9.8" fill="#64748B">Pod C는 일반 요청 대상에서 제외</text>

  <path d="M157.5 258 V302 H410 V410 H445" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="275" y="294" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">고정 주소와 포트 상태</text>
  <path d="M957.5 258 V302 H725 V410 H695" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="845" y="294" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">요청 가능한 Pod 주소 상태</text>

  <rect x="445" y="365" width="250" height="90" rx="14" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="570" y="397" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="600">노드 네트워크 구성 요소</text>
  <text x="570" y="421" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#0D9488">kube-proxy 또는 네트워크 플러그인</text>
  <text x="570" y="441" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#0D9488">Service와 EndpointSlice 상태로 규칙 동기화</text>

  <path d="M570 455 V492" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="588" y="478" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">네트워크 규칙 반영</text>

  <rect x="35" y="492" width="145" height="72" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="107.5" y="521" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#C2410C" font-weight="600">Client</text>
  <text x="107.5" y="545" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#EA580C">Pod 주소를 알지 못함</text>

  <path d="M180 528 H225" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="202.5" y="511" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#C2410C">요청</text>

  <rect x="225" y="492" width="165" height="72" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="307.5" y="520" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">Service 진입점</text>
  <text x="307.5" y="545" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#EA580C">web:80, ClusterIP</text>

  <path d="M390 528 H445" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <rect x="445" y="492" width="250" height="72" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="570" y="520" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">동기화된 네트워크 규칙</text>
  <text x="570" y="545" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#EA580C">Ready Endpoint 하나를 선택해 8080 포트로 전달</text>

  <path d="M695 528 H750" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="722.5" y="511" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" fill="#C2410C">요청 전달</text>

  <rect x="750" y="477" width="310" height="102" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="905" y="505" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8" font-weight="600">요청을 받을 수 있는 Pod</text>
  <rect x="775" y="521" width="120" height="38" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="835" y="545" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Pod A :8080</text>
  <rect x="915" y="521" width="120" height="38" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.3"/>
  <text x="975" y="545" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Pod B :8080</text>

  <rect x="70" y="596" width="960" height="38" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="550" y="620" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#B45309">Pod가 교체되면 EndpointSlice와 네트워크 규칙만 갱신되고, Client는 같은 Service 이름과 포트를 계속 사용</text>

  <line x1="40" y1="650" x2="1060" y2="650" stroke="#E2E8F0" stroke-width="1"/>
  <text x="550" y="680" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 3. Service:</tspan>
    <tspan> 선언된 안정적 접근점과 변하는 Pod를 연결하는 제어 흐름과 요청 경로</tspan>
  </text>
</svg>
