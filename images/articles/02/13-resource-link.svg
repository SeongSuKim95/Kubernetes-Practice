  <text x="460" y="340" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">경로: Service → Pod  ·  Deployment·Service는 label로 Pod에 간접 연결</text>

  <line x1="40" y1="365" x2="880" y2="365" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="393" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 15. 리소스 연결:</tspan>
    <tspan> Pod label로 맞물리는 Service·Deployment 관계</tspan>
