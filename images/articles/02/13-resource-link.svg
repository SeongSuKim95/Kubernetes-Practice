  <text x="140" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#B45309">요청</text>

  <path d="M240 85 H310" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#rg)"/>

  <rect x="310" y="50" width="220" height="70" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="420" y="80" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="600">Service</text>
  <text x="420" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">selector: app=web</text>

  <path d="M530 85 H600" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rl)"/>
