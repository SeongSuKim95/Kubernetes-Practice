  <text x="740" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#3B82F6">응답</text>

  <rect x="310" y="200" width="220" height="90" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
