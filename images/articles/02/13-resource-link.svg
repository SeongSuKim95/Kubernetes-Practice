  <text x="140" y="265" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#7C3AED">운영 경계</text>

  <path d="M240 245 H310" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 3"/>
