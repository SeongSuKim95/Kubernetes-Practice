<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
  <rect width="1040" height="520" fill="#F7F9FC"/>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect x="25" y="20" width="990" height="205" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="50" y="51" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#1D4ED8" font-weight="700">제어 흐름: 2장에서 본 API 상태와 Watch</text>

  <rect x="60" y="85" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="165" y="115" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#6D28D9" font-weight="700">Ingress 리소스</text>
  <text x="165" y="140" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#7C3AED">host, path, Service 선언</text>

  <path d="M270 130 H355" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="312.5" y="113" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">API에 저장</text>

  <rect x="365" y="85" width="210" height="90" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="115" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="700">API Server</text>
  <text x="470" y="140" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">공유 상태의 진입점</text>

  <path d="M575 130 H660" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="617.5" y="113" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#1D4ED8">상태 변화 Watch</text>

  <rect x="670" y="75" width="310" height="110" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="825" y="108" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="700">별도로 설치한 Ingress Controller</text>
  <text x="825" y="136" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">Ingress 규칙을 프록시 설정에 반영</text>
  <text x="825" y="160" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">Controller가 없으면 Ingress만으로 요청을 처리하지 못함</text>

  <rect x="25" y="245" width="990" height="205" rx="16" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  <text x="50" y="276" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="700">요청 흐름: Controller가 구현한 HTTP 경로</text>

  <rect x="55" y="315" width="170" height="75" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="140" y="345" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#C2410C" font-weight="700">외부 클라이언트</text>
  <text x="140" y="369" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#EA580C">example.com/web</text>

  <path d="M225 352.5 H315" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="270" y="335" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0F766E">HTTP 요청</text>

  <rect x="325" y="305" width="240" height="95" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="445" y="336" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="700">Ingress Controller</text>
  <text x="445" y="361" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">host와 path로 Service 선택</text>
  <text x="445" y="381" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">web Service의 80번 포트로 전달</text>

  <path d="M565 352.5 H655" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#green)"/>

  <rect x="665" y="315" width="150" height="75" rx="12" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="740" y="345" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="700">Service: web</text>
  <text x="740" y="369" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">port: 80</text>

  <path d="M815 352.5 H875" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#green)"/>

  <rect x="885" y="315" width="100" height="75" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="935" y="345" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="700">Pod</text>
  <text x="935" y="369" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#2563EB">:8080</text>

  <line x1="40" y1="474" x2="1000" y2="474" stroke="#E2E8F0"/>
  <text x="520" y="504" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 5. Ingress Controller:</tspan>
    <tspan> Ingress 상태 구독과 외부 HTTP 요청 처리</tspan>
  </text>
</svg>
