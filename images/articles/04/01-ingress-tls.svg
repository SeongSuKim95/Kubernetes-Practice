<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#F7F9FC"/>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect x="20" y="22" width="1160" height="245" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="45" y="53" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">API에 선언된 TLS 상태와 Controller의 설정 과정</text>

  <rect x="45" y="75" width="285" height="155" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="187.5" y="106" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="600">Ingress 리소스</text>
  <rect x="70" y="122" width="235" height="28" rx="7" fill="#EFF6FF"/>
  <text x="187.5" y="141" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">tls.hosts: example.com</text>
  <rect x="70" y="158" width="235" height="28" rx="7" fill="#EFF6FF"/>
  <text x="187.5" y="177" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">secretName: example-com-tls</text>
  <rect x="70" y="194" width="235" height="28" rx="7" fill="#EFF6FF"/>
  <text x="187.5" y="213" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">rules.host: example.com → Service web:80</text>

  <path d="M330 150 H425" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="377.5" y="133" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">이름으로 참조</text>

  <rect x="425" y="75" width="300" height="155" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="575" y="106" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#0F766E" font-weight="600">TLS Secret: example-com-tls</text>
  <text x="575" y="129" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0D9488">type: kubernetes.io/tls</text>
  <rect x="450" y="145" width="250" height="33" rx="7" fill="#ECFDF5"/>
  <text x="575" y="166" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#047857">tls.crt — example.com 공개 인증서</text>
  <rect x="450" y="187" width="250" height="33" rx="7" fill="#FFF7ED"/>
  <text x="575" y="208" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#C2410C">tls.key — 인증서와 짝인 개인 키</text>

  <path d="M725 152 H820" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="772.5" y="134" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Secret 읽기</text>
  <path d="M187.5 75 V63 H982.5 V75" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="760" y="57" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Ingress 규칙 관찰</text>

  <rect x="820" y="75" width="335" height="155" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="987.5" y="106" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="600">Ingress Controller</text>
  <text x="987.5" y="139" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">Ingress의 host·path·secretName 확인</text>
  <text x="987.5" y="166" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">Secret에서 인증서와 개인 키 로드</text>
  <text x="987.5" y="193" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#3B82F6">HTTPS 443 진입점과 Service 경로 설정</text>

  <path d="M987.5 230 V280 H520 V350" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="755" y="274" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">Controller가 관리하는 HTTPS 진입점에 설정 반영</text>

  <rect x="20" y="292" width="1160" height="276" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="45" y="323" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#C2410C" font-weight="600">HTTPS 요청과 TLS 종료 이후의 요청 경로</text>

  <rect x="45" y="365" width="220" height="125" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
  <text x="155" y="397" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#C2410C" font-weight="600">외부 클라이언트</text>
  <text x="155" y="428" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#EA580C">example.com으로 HTTPS 접속</text>
  <text x="155" y="451" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#EA580C">인증서의 도메인·발급자·유효기간 확인</text>
  <text x="155" y="474" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.3" fill="#9A3412">검증 후 암호화된 연결 수립</text>

  <path d="M265 410 H370" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="317.5" y="391" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#C2410C">① HTTPS 요청과 SNI</text>
  <path d="M370 450 C335 525 290 525 250 480" fill="none" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="320" y="535" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#0F766E">② tls.crt 인증서 제시</text>

  <rect x="370" y="350" width="300" height="155" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="520" y="382" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#1D4ED8" font-weight="600">Ingress Controller의 HTTPS 진입점</text>
  <text x="520" y="413" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#3B82F6">인증서와 개인 키로 TLS Handshake 수행</text>
  <rect x="395" y="431" width="250" height="30" rx="7" fill="#EFF6FF"/>
  <text x="520" y="451" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#1D4ED8">tls.crt는 제시 · tls.key는 외부 전송 안 함</text>
  <text x="520" y="486" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#3B82F6">TLS 종료 후 HTTP 요청으로 라우팅</text>

  <path d="M670 427 H760" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="715" y="406" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#C2410C">③ 복호화된 HTTP</text>

  <rect x="760" y="365" width="180" height="125" rx="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="850" y="402" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="600">Service: web</text>
  <text x="850" y="433" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#0D9488">Service port: 80</text>
  <text x="850" y="459" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#0D9488">Ready Pod 선택</text>

  <path d="M940 427 H990" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="965" y="406" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.5" fill="#C2410C">④ 전달</text>

  <rect x="990" y="365" width="165" height="125" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1072.5" y="402" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#1D4ED8" font-weight="600">Pod</text>
  <text x="1072.5" y="433" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#3B82F6">Container :8080</text>
  <text x="1072.5" y="459" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10.8" fill="#3B82F6">애플리케이션 처리</text>

  <line x1="40" y1="592" x2="1160" y2="592" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="622" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 7. Ingress TLS:</tspan>
    <tspan> Ingress가 TLS Secret의 인증서를 참조하고 HTTPS 요청을 Service로 전달하는 흐름</tspan>
  </text>
</svg>
