  <line x1="40" y1="130" x2="920" y2="130" stroke="#E2E8F0" stroke-width="1"/>
  <text x="480" y="175" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 1. 기술이 쌓여 온 큰 그림:</tspan>
    <tspan> 가상화에서 Kubernetes까지의 발전 흐름</tspan>
