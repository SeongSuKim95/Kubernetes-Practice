<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210">
  <rect width="960" height="210" fill="#F7F9FC"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5B6B7C"/>
    </marker>
  </defs>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" text-anchor="middle">
    <rect x="28" y="30" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="93" y="60" fill="#334155">물리 서버</text>
    <text x="93" y="80" fill="#64748B" font-size="11">앱 1개 / 서버 1대</text>

    <rect x="188" y="30" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="253" y="60" fill="#334155">가상 머신</text>
    <text x="253" y="80" fill="#64748B" font-size="11">OS를 통째로 나눔</text>

    <rect x="348" y="30" width="140" height="70" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
    <text x="418" y="60" fill="#0F766E" font-weight="600">컨테이너·Docker</text>
    <text x="418" y="80" fill="#0F766E" font-size="11">가벼운 실행 상자</text>

    <rect x="518" y="30" width="130" height="70" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="583" y="60" fill="#334155">여러 컨테이너</text>
    <text x="583" y="80" fill="#64748B" font-size="11">한 서버에서 묶기</text>

    <rect x="678" y="30" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="738" y="60" fill="#334155">여러 서버</text>
    <text x="738" y="80" fill="#64748B" font-size="11">분산·복구</text>

    <rect x="828" y="30" width="110" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="883" y="70" fill="#1D4ED8" font-weight="600">Kubernetes</text>
  </g>
  <g stroke="#5B6B7C" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="158" y1="65" x2="182" y2="65"/>
    <line x1="318" y1="65" x2="342" y2="65"/>
    <line x1="488" y1="65" x2="512" y2="65"/>
    <line x1="648" y1="65" x2="672" y2="65"/>
    <line x1="798" y1="65" x2="822" y2="65"/>
