<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="920" height="420" fill="#F7F9FC"/>
  <defs>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <circle cx="90" cy="160" r="42" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="90" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#92400E" font-weight="600">사용자</text>
  <text x="90" y="175" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#B45309">curl</text>

  <path d="M140 160 H200" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="170" y="145" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#DC2626">요청</text>
  <text x="170" y="180" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#DC2626">실패</text>

  <rect x="220" y="40" width="420" height="280" rx="16" fill="#ECFDF5" stroke="#0D9488" stroke-width="3"/>
  <text x="430" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="600">Container web-server-2</text>

  <rect x="260" y="95" width="340" height="55" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="430" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E" font-weight="600">docker ps: Up = 실행 중</text>
  <text x="430" y="140" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">목록에는 정상으로 보임</text>

  <rect x="280" y="175" width="300" height="110" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="430" y="210" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#B91C1C" font-weight="600">요청을 받던 웹 서버</text>
  <text x="430" y="240" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" fill="#DC2626" font-weight="600">✕ 멈춤</text>
  <text x="430" y="268" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#DC2626">강제 종료 후, 응답 불가</text>

  <rect x="680" y="80" width="210" height="200" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="785" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#C2410C" font-weight="600">불일치</text>
  <text x="785" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#EA580C">목록은 실행 중</text>
  <text x="785" y="185" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#EA580C">웹 서버는 멈춤</text>
  <text x="785" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#9A3412">사람이 컨테이너를</text>
  <text x="785" y="252" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#9A3412">restart로 다시 살림</text>

  <line x1="40" y1="360" x2="880" y2="360" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="392" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 22. 시나리오 7:</tspan>
    <tspan> 실행 중으로 보이는 컨테이너와 멈춰 버린 웹 서버</tspan>
  </text>
