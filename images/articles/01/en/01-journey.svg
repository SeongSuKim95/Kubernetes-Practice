  <text x="915" y="218" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#64748B">Delegate to platform</text>

  <line x1="40" y1="280" x2="980" y2="280" stroke="#E2E8F0" stroke-width="1"/>
  <text x="510" y="315" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 1. Evolution path:</tspan>
