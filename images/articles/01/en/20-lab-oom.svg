<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
  <rect width="920" height="380" fill="#F7F9FC"/>
  <defs>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="240" height="220" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="85" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">Memory limit 10MB</text>
  <rect x="80" y="110" width="160" height="120" rx="10" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="160" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#B91C1C" font-weight="600">Usage grows</text>
  <text x="160" y="180" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" fill="#DC2626">↑↑</text>
  <text x="160" y="215" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">Exceeds limit</text>

  <path d="M290 160 H350" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="320" y="145" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#DC2626">Force kill</text>

  <rect x="360" y="50" width="240" height="220" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="480" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#B91C1C" font-weight="600">Container dies</text>
  <text x="480" y="140" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#DC2626">Out of memory:</text>
  <text x="480" y="165" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#DC2626">kernel kills the process</text>
  <text x="480" y="210" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">STATUS: Exited</text>
  <text x="480" y="235" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">Does not raise the limit</text>

  <path d="M610 160 H670" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="640" y="145" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">Person</text>
  <text x="640" y="180" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#0D9488">runs again</text>

  <rect x="680" y="50" width="200" height="220" rx="14" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="780" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Limit 100MB</text>
  <text x="780" y="160" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0D9488">Restart with</text>
  <text x="780" y="185" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0D9488">a larger limit</text>

  <line x1="40" y1="322" x2="880" y2="322" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="350" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 19. Scenario 4:</tspan>
    <tspan> OOM kill from low limit, then manual restart</tspan>
  </text>

</svg>
