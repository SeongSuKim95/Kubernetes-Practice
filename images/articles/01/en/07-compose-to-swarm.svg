<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="920" height="400" fill="#F7F9FC"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="380" height="280" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="230" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#C2410C" font-weight="600">Docker Compose</text>
  <text x="230" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#EA580C">One server, start via YAML</text>
  <rect x="80" y="130" width="300" height="160" rx="12" fill="#FFFFFF" stroke="#FDBA74"/>
  <text x="230" y="158" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#9A3412" font-weight="600">Host 1</text>
  <rect x="100" y="185" width="80" height="70" rx="8" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="140" y="225" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C">web</text>
  <rect x="190" y="185" width="80" height="70" rx="8" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="230" y="225" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C">app</text>
  <rect x="280" y="185" width="80" height="70" rx="8" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="320" y="225" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C">db</text>

  <path d="M430 180 H490" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="460" y="165" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#2563EB">As servers</text>
  <text x="460" y="205" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#2563EB">grow</text>

  <rect x="500" y="40" width="380" height="280" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="690" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#5B21B6" font-weight="600">Docker Swarm</text>
  <text x="690" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#7C3AED">Many servers: place &amp; recover</text>
  <rect x="530" y="125" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="605" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#5B21B6" font-weight="600">Node A</text>
  <rect x="550" y="175" width="110" height="35" rx="6" fill="#DDD6FE" stroke="#7C3AED"/>
  <text x="605" y="198" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#5B21B6">web, app</text>
  <rect x="700" y="125" width="150" height="150" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="775" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#5B21B6" font-weight="600">Node B</text>
  <rect x="720" y="175" width="110" height="35" rx="6" fill="#DDD6FE" stroke="#7C3AED"/>
  <text x="775" y="198" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#5B21B6">app, db</text>
  <text x="690" y="300" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#6D28D9">Restart dead containers on another Node</text>

  <line x1="40" y1="342" x2="880" y2="342" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="370" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 14. Docker Compose and Docker Swarm:</tspan>
    <tspan> from one-host start to multi-server place &amp; recover</tspan>
  </text>

</svg>
