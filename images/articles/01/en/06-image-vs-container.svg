<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <rect width="880" height="360" fill="#F7F9FC"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="60" y="60" width="220" height="180" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="170" y="100" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="16" fill="#1D4ED8" font-weight="600">Image</text>
  <text x="170" y="130" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#3B82F6">Non-running blueprint</text>
  <text x="170" y="160" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#64748B">e.g. nginx:latest</text>
  <text x="170" y="200" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#94A3B8">Files and config only</text>

  <path d="M290 150 H360" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="325" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#2563EB">docker run</text>

  <rect x="370" y="50" width="200" height="100" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="470" y="85" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Container 1</text>
  <text x="470" y="110" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">Running, host 8080</text>

  <rect x="370" y="170" width="200" height="100" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="470" y="205" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Container 2</text>
  <text x="470" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">Running, host 8081</text>

  <rect x="620" y="80" width="220" height="160" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="730" y="130" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">Same Image can</text>
  <text x="730" y="160" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C">start many</text>
  <text x="730" y="190" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C">containers</text>

  <line x1="40" y1="302" x2="840" y2="302" stroke="#E2E8F0" stroke-width="1"/>
  <text x="440" y="330" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 8. Image and Container:</tspan>
    <tspan> one blueprint, many running processes</tspan>
  </text>

</svg>
