<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <rect width="900" height="380" fill="#F7F9FC"/>
  <defs>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0D9488"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="380" height="250" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="230" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#B91C1C" font-weight="600">No volume</text>
  <rect x="100" y="100" width="260" height="90" rx="10" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="230" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#B91C1C" font-weight="600">Container</text>
  <text x="230" y="160" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#DC2626">Data only inside container</text>
  <path d="M230 200 V230" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#r)"/>
  <text x="230" y="265" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#B91C1C">docker rm → data gone</text>

  <rect x="480" y="40" width="380" height="250" rx="14" fill="#ECFDF5" stroke="#0D9488" stroke-width="2"/>
  <text x="670" y="75" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Volume mount</text>
  <rect x="540" y="95" width="260" height="70" rx="10" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="670" y="125" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E" font-weight="600">Container</text>
  <text x="670" y="148" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">/var/lib/mysql</text>
  <path d="M670 170 V195" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#g)"/>
  <rect x="540" y="200" width="260" height="50" rx="10" fill="#A7F3D0" stroke="#0D9488"/>
  <text x="670" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#065F46" font-weight="600">Volume db-data keeps data</text>

  <line x1="40" y1="322" x2="860" y2="322" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 24. Scenario 9:</tspan>
    <tspan> data survival with and without a volume</tspan>
  </text>

</svg>
