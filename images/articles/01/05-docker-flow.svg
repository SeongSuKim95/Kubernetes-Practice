<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#F7F9FC"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect x="40" y="70" width="160" height="100" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#92400E" font-weight="600">Docker Client</text>
  <text x="120" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#B45309">터미널의 docker 명령</text>

  <path d="M205 120 H255" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="230" y="105" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" fill="#2563EB">docker run</text>

  <rect x="260" y="70" width="170" height="100" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="345" y="110" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#1D4ED8" font-weight="600">Docker Daemon</text>
  <text x="345" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#3B82F6">백그라운드 관리 프로세스</text>

  <path d="M435 120 H485" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="490" y="70" width="170" height="100" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="575" y="105" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#334155" font-weight="600">Linux Kernel</text>
  <text x="575" y="128" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">프로세스 공간 분리</text>
  <text x="575" y="148" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">CPU, 메모리 제한</text>

  <path d="M665 120 H715" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="720" y="70" width="140" height="100" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
  <text x="790" y="110" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#0F766E" font-weight="600">Container</text>
  <text x="790" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0D9488">실행 중인 프로세스</text>

  <line x1="40" y1="232" x2="860" y2="232" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="260" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 7. docker run 흐름:</tspan>
    <tspan> Client, Daemon, Container로 이어지는 기동 경로</tspan>
  </text>

</svg>
