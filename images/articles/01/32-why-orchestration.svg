<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <rect width="920" height="360" fill="#F7F9FC"/>

  <rect x="40" y="40" width="250" height="200" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="165" y="70" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="600">서버 A</text>
  <rect x="70" y="95" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#14B8A6"/>
  <text x="115" y="122" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E">웹 ×2</text>
  <rect x="170" y="95" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#14B8A6"/>
  <text x="215" y="122" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E">앱 ×1</text>
  <text x="165" y="175" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">컨테이너가 정상 실행 중</text>
  <text x="165" y="210" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E">요청을 여기로도 나눌까?</text>

  <rect x="335" y="40" width="250" height="200" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="460" y="70" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#B91C1C" font-weight="600">서버 B</text>
  <text x="460" y="115" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#DC2626" font-weight="600">장애로 멈춤</text>
  <text x="460" y="150" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">웹 컨테이너가 사라짐</text>
  <text x="460" y="185" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#B91C1C">어디에 다시 올릴까?</text>
  <text x="460" y="210" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#B91C1C">누가 다시 살릴까?</text>

  <rect x="630" y="40" width="250" height="200" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="755" y="70" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#0F766E" font-weight="600">서버 C</text>
  <rect x="660" y="95" width="90" height="44" rx="8" fill="#ECFDF5" stroke="#14B8A6"/>
  <text x="705" y="122" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#0F766E">웹 ×1</text>
  <rect x="760" y="95" width="90" height="44" rx="8" fill="#EFF6FF" stroke="#60A5FA"/>
  <text x="805" y="122" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8">DB ×1</text>
  <text x="755" y="175" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#64748B">IP가 바뀌어도</text>
  <text x="755" y="210" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#0F766E">서비스 이름으로 찾을까?</text>

  <line x1="40" y1="270" x2="880" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="305" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 12. 오케스트레이션이 필요한 이유:</tspan>
    <tspan> 여러 서버의 배치, 복구, 연결을 사람이 손으로 맞추기 어려움</tspan>
  </text>
</svg>
