<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440">
  <rect width="980" height="440" fill="#F7F9FC"/>

  <rect x="30" y="40" width="300" height="120" rx="12" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="180" y="80" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#B91C1C" font-weight="600">컨테이너가 죽으면</text>
  <text x="180" y="105" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#B91C1C" font-weight="600">사람이 컨테이너를 다시 start</text>
  <text x="180" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#DC2626">컨테이너 자동 복구 없음</text>

  <rect x="340" y="40" width="300" height="120" rx="12" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="490" y="80" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">컨테이너를 늘릴 때</text>
  <text x="490" y="105" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#C2410C" font-weight="600">포트와 로드 밸런서 목록을 수정</text>
  <text x="490" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#EA580C">컨테이너 개수와 부하 분산이 수동</text>

  <rect x="650" y="40" width="300" height="120" rx="12" fill="#FEF3C7" stroke="#D97706"/>
  <text x="800" y="80" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#92400E" font-weight="600">컨테이너가 실행 중이어도</text>
  <text x="800" y="105" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#92400E" font-weight="600">웹 서버가 멈춰 있을 수 있음</text>
  <text x="800" y="135" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#B45309">웹 서버 생존을 따로 확인</text>

  <rect x="185" y="190" width="300" height="120" rx="12" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="335" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8" font-weight="600">이미지 버전을 바꿀 때</text>
  <text x="335" y="255" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#1D4ED8" font-weight="600">컨테이너마다 stop, rm, run</text>
  <text x="335" y="285" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#3B82F6">컨테이너 단위로 교체 반복</text>

  <rect x="495" y="190" width="300" height="120" rx="12" fill="#E0E7FF" stroke="#6366F1"/>
  <text x="645" y="230" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#4338CA" font-weight="600">컨테이너 IP와 볼륨을</text>
  <text x="645" y="255" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#4338CA" font-weight="600">사람이 직접 설계</text>
  <text x="645" y="285" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12" fill="#6366F1">컨테이너 연결과 데이터 생존을 직접 챙김</text>

  <line x1="40" y1="360" x2="940" y2="360" stroke="#E2E8F0" stroke-width="1"/>
  <text x="490" y="392" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#475569">
    <tspan font-weight="600">Fig 25. 시나리오 10:</tspan>
    <tspan> Docker만으로 운용할 때 사람이 반복하는 작업</tspan>
  </text>
</svg>
